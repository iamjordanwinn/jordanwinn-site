.inline-link:hover{color:var(--accent);border-color:var(--accent)}.intro-period{color:var(--accent)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));column-gap:clamp(45px,9vw,150px);row-gap:14px;margin-top:clamp(56px,7vh,91px);width:fit-content}
