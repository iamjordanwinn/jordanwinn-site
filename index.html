<title>Jordan Winn — Brand Designer & Creative Director</title>
<style>
:root{color-scheme:light;--background:#fffeee;--ink:#181613;--highlight:#d6fa70;--muted:#656357}
*,*::before,*::after{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{min-height:100svh;margin:0;color:var(--ink);background:var(--background);font-family:"Figtree",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}a:focus-visible{outline:2px solid var(--ink);outline-offset:5px;background:var(--highlight)}
::selection{background:var(--highlight);color:var(--ink)}
.page{width:100%;max-width:1680px;min-height:100svh;padding:clamp(26px,4.35vw,76px) clamp(26px,5.05vw,88px);margin-inline:auto;display:flex;flex-direction:column}
.site-header{display:flex;align-items:flex-start}
.logo-link{display:inline-block;width:max-content;line-height:0}
.logo{display:block;height:60px;width:auto;max-width:100%}
main{width:100%;margin:auto 0;padding:clamp(65px,9vh,115px) 0}
h1{font-size:clamp(42px,5.05vw,82px);line-height:1.11;letter-spacing:-.04em;font-weight:500;max-width:1450px;margin:0;text-wrap:balance}
.inline-link{text-decoration:none;border-bottom:.065em solid var(--ink);transition:background .18s ease;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.inline-link:hover{background:var(--highlight)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));column-gap:clamp(42px,8vw,140px);row-gap:15px;margin-top:clamp(48px,6.7vh,82px);width:fit-content}
.link{display:inline-flex;align-items:baseline;gap:11px;font-size:clamp(17px,1.65vw,23px);line-height:1.45;letter-spacing:-.02em;font-weight:500;text-decoration:none;white-space:nowrap}

.link-label{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;transition:background .18s ease}
.link:hover .link-label{background:var(--highlight)}
.link svg{align-self:center;width:.65em;height:.65em;stroke-width:1.5;transform:translateY(-1px);opacity:.6;transition:transform .18s ease,opacity .18s ease}
.link:hover svg{transform:translate(2px,-3px);opacity:1}
@media(max-width:800px){.logo{height:60px}h1{font-size:clamp(38px,5.8vw,55px)}.links{grid-template-columns:1fr;row-gap:12px;margin-top:48px}main{padding-block:70px}}
@media(max-width:440px){.page{padding:26px 23px}.logo{height:auto;width:100%;max-width:380px}main{padding-block:65px 70px}h1{font-size:clamp(35px,9vw,41px);line-height:1.12;text-wrap:pretty}.links{margin-top:44px;row-gap:15px}.link{font-size:18px}.inline-link{box-decoration-break:clone}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>

<main id="main-content">
<h1>Brand designer, creative director, and founder of <a class="inline-link" href="https://labordivision.com/" target="_blank" rel="noopener noreferrer">Labor Division</a>.</h1>
